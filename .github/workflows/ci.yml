name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--filter multi`, not a bare `pnpm exec`: `@playwright/test` is a dependency of
      # apps/multi, and pnpm does not link a workspace package's binaries into the root
      # `node_modules/.bin`. From the root the command is simply not there, and CI fails with
      # "Command \"playwright\" not found". It can appear to work locally by picking up an
      # unrelated Playwright from a parent directory — at whatever version that happens to be.
      - run: pnpm --filter multi exec playwright install --with-deps chromium

      # `check` is typecheck + lint + unit + e2e. The e2e suite is the only place the spec's
      # acceptance criteria are actually measured — tenant isolation, well-known Content-Type,
      # the consent gate, attribution and graduation parity — so a green build without it
      # would not mean much.
      - run: pnpm check
        env:
          CI: "true"
